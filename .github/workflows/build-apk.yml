name: Build Sn Smart Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova Project & Inject Code
        run: |
          cordova create build_project com.snsmart.rewardsapp "Sn Smart"
          cd build_project
          rm -rf www/*
          cp -r ../index.html www/
          cp -r ../js www/
          cp ../config.xml ./
          cordova platform add android@12.0.0
          cordova build android --debug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sn-Smart-Release-APK
          path: build_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
