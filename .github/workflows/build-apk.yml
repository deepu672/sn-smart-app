
name: Build SN Smart Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Cordova Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Cordova Project
        id: project
        shell: bash
        run: |
          echo "Searching for config.xml..."
          CONFIG=$(find . -type f -name config.xml \
            -not -path './.git/*' | head -n 1)

          if [ -z "$CONFIG" ]; then
            echo "ERROR: No config.xml found in repository."
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          DIR=$(dirname "$CONFIG")
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Cordova project found: $DIR"
          ls -la "$DIR"

      - name: Install Cordova CLI
        run: npm install -g cordova@12.0.0

      - name: Install Dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Prepare Android Platform
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ ! -d www ]; then
            echo "ERROR: www folder missing beside config.xml"
            exit 1
          fi

          cordova platform add android@13.0.0

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: cordova build android --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SN-Smart-Android-APK
          path: ${{ steps.project.outputs.project_dir }}/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
