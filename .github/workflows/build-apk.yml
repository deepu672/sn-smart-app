
name: Build SN Smart Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Cordova Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: build_project/package-lock.json
        continue-on-error: true

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android Project
        run: |
          if [ ! -f build_project/config.xml ]; then
            echo "ERROR: build_project/config.xml not found"
            exit 1
          fi

          if [ ! -d build_project/www ]; then
            echo "ERROR: build_project/www folder not found"
            exit 1
          fi

      - name: Install Cordova CLI
        run: npm install -g cordova@12.0.0

      - name: Install Project Dependencies
        working-directory: build_project
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Recreate Android Platform
        working-directory: build_project
        run: |
          cordova platform rm android || true
          cordova platform add android@13.0.0

      - name: Build Debug APK
        working-directory: build_project
        run: |
          cordova requirements android
          cordova build android --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SN-Smart-Android-APK
          path: build_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
