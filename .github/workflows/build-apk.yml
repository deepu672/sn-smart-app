name: Build Sn Smart Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build Cordova Android APK
        run: |
          cordova create build_project com.snsmart.rewardsapp "Sn Smart"
          cd build_project
          rm -rf www/*
          cp -r ../index.html www/
          cp -r ../js www/
          cp ../config.xml ./
          cordova platform add android@12.0.0 --save
          cordova build android --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sn-Smart-Release-APK
          path: build_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          

      - name: Fix XmlParser import
        run: |
          FILE="build_project/platforms/android/CordovaLib/cordova.gradle"
          if [ -f "$FILE" ]; then
            sed -i '1i import groovy.util.XmlParser' "$FILE"
          fi
          
